name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERIFY_REQUIRE_SWIFT: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: JS packages
        run: |
          corepack enable
          pnpm --dir packages/openfeature install --frozen-lockfile
          pnpm --dir host install --frozen-lockfile --ignore-scripts
      - name: Verify without Swift
        run: make verify

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: JS packages
        run: |
          corepack enable
          pnpm --dir packages/openfeature install --frozen-lockfile
          pnpm --dir host install --frozen-lockfile --ignore-scripts
      - name: Verify with Swift
        run: make verify

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Denylist
        run: node --experimental-strip-types scripts/check-denylist.mjs
      - name: Secret scan
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir . --no-banner --redact
